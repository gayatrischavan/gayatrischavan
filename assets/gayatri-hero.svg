
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gayatri Chavan — Developer Profile</title>
  <desc id="desc">A burgundy developer banner with subtle technical details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="55%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
